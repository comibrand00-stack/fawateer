<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الفواتير — إدارة الأعمال</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fas fa-file-invoice-dollar"></i>
          <span>فواتيري</span>
        </div>
        <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
      </div>

      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-item" data-route="dashboard">
          <i class="fas fa-th-large"></i><span>لوحة التحكم</span>
        </a>
        <a href="#/invoices" class="nav-item" data-route="invoices">
          <i class="fas fa-file-invoice"></i><span>الفواتير</span>
          <span class="nav-badge" id="navBadgeInvoices">0</span>
        </a>
        <a href="#/receipts" class="nav-item" data-route="receipts">
          <i class="fas fa-receipt"></i><span>إيصالات الدفع</span>
        </a>
        <a href="#/clients" class="nav-item" data-route="clients">
          <i class="fas fa-users"></i><span>العملاء</span>
        </a>
        <a href="#/products" class="nav-item" data-route="products">
          <i class="fas fa-box-open"></i><span>المنتجات</span>
        </a>
        <a href="#/expenses" class="nav-item" data-route="expenses">
          <i class="fas fa-coins"></i><span>المصروفات</span>
        </a>
        <a href="#/reports" class="nav-item" data-route="reports">
          <i class="fas fa-chart-line"></i><span>التقارير</span>
        </a>
        <a href="#/tax" class="nav-item" data-route="tax">
          <i class="fas fa-calculator"></i><span>حاسبة الضرائب</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#/settings" class="nav-item" data-route="settings">
          <i class="fas fa-cog"></i><span>الإعدادات</span>
        </a>
        <button class="nav-item" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span>
        </button>
        <button class="nav-item" id="toggleTheme">
          <i class="fas fa-moon"></i><span id="themeLabel">الوضع الليلي</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <div class="topbar-title" id="topbarTitle">لوحة التحكم</div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" id="btnNewInvoice">
            <i class="fas fa-plus"></i><span>فاتورة جديدة</span>
          </button>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Global modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Login screen -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-logo"><i class="fas fa-file-invoice-dollar"></i></div>
      <h2>نظام فواتيري</h2>
      <p class="login-sub">سجّل دخولك للمتابعة</p>
      <div class="login-user-name" id="loginUserName" style="display:none"></div>
      <input type="text" id="loginUser" class="form-control login-input" placeholder="اسم المستخدم" autocomplete="username">
      <input type="password" id="loginPass" class="form-control login-input" placeholder="كلمة المرور" autocomplete="current-password">
      <div class="login-error" id="loginError"></div>
      <button class="btn btn-primary login-btn" id="loginBtn"><i class="fas fa-lock"></i> دخول</button>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/invoices.js"></script>
  <script src="js/receipts.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/products.js"></script>
  <script src="js/expenses.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/tax.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/pdf-export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
